name: prune-superseded
on:
  push:
    branches:
      - staging/eig-core-canonical
    paths:
      - .eig-prune-trigger
jobs:
  prune:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging/eig-core-canonical
      - name: Prune superseded documents
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          p = Path('README.md')
          s = p.read_text()
          s = s.replace("\n**Boundary atlas:** [`EIG_IDENTIFIABILITY_BOUNDARIES_20260902.md`](EIG_IDENTIFIABILITY_BOUNDARIES_20260902.md)\n", "")
          s = s.replace(
              "The detailed theorem status remains in [`STATUS.md`](STATUS.md). Broader conjectural directions are recorded separately in [`ROADMAP.md`](ROADMAP.md) and [`theory/03-weir.md`](theory/03-weir.md); they are not part of the README's theorem surface.\n\n",
              "The generic EIG Core theorem-status ledger is maintained in [`EIG_CORE.md`](EIG_CORE.md); discovery-specific claims are documented with their own proofs, certificates, and audits.\n\n",
          )
          old = """1. [`EIG_CORE.md`](EIG_CORE.md) — canonical Core construction, canonicality theorem, and reconstruction boundaries.
2. [`EIG_IDENTIFIABILITY_BOUNDARIES_20260902.md`](EIG_IDENTIFIABILITY_BOUNDARIES_20260902.md) — boundary-first viewpoint and output schema.
3. [`FOUNDATIONS.md`](FOUNDATIONS.md) — minimal setup and proved calibrations.
4. [`theory/01-finite-exact-interactions.md`](theory/01-finite-exact-interactions.md) — smallest exact calculus.
5. [`theory/02-category-reconstruction.md`](theory/02-category-reconstruction.md) — exact object/typing/Hom reconstruction calibration.
6. [`discoveries/two-state-maxplus-comparison.pdf`](discoveries/two-state-maxplus-comparison.pdf) — strongest current conventional-mathematics theorem generated by the programme.
7. [`PRIOR_ART.md`](PRIOR_ART.md) and [`CONTEMPORARY_NEIGHBORS.md`](CONTEMPORARY_NEIGHBORS.md) — novelty and neighbour boundary.
8. [`STATUS.md`](STATUS.md) — detailed epistemic ledger.
9. [`ROADMAP.md`](ROADMAP.md) — broader open directions.
"""
          new = """1. [`EIG_CORE.md`](EIG_CORE.md) — canonical Core construction, canonicality theorem, and reconstruction boundaries.
2. [`theory/01-finite-exact-interactions.md`](theory/01-finite-exact-interactions.md) — smallest exact calculus.
3. [`theory/02-category-reconstruction.md`](theory/02-category-reconstruction.md) — exact object/typing/Hom reconstruction calibration.
4. [`discoveries/two-state-maxplus-comparison.pdf`](discoveries/two-state-maxplus-comparison.pdf) — strongest current conventional-mathematics theorem generated by the programme.
5. [`PRIOR_ART.md`](PRIOR_ART.md) and [`CONTEMPORARY_NEIGHBORS.md`](CONTEMPORARY_NEIGHBORS.md) — novelty and neighbour boundary.
6. [`provenance/SOURCE_MAP.md`](provenance/SOURCE_MAP.md) — research provenance and curation history.
"""
          if old not in s:
              raise SystemExit('README read-order block not found')
          s = s.replace(old, new)
          p.write_text(s)

          p = Path('provenance/SOURCE_MAP.md')
          s = p.read_text()
          old = """The finite response calculus, interaction-first objecthood formulation, and category-reconstruction theorem were extracted from EIG material developed on 2026-08-30/31. Public files:

- [`../theory/01-finite-exact-interactions.md`](../theory/01-finite-exact-interactions.md)
- [`../FOUNDATIONS.md`](../FOUNDATIONS.md)
- [`../theory/02-category-reconstruction.md`](../theory/02-category-reconstruction.md)
- [`../theory/03-weir.md`](../theory/03-weir.md)

The larger research ledger is intentionally not mirrored here. Newer results are imported only when they improve the public mathematical surface without importing unresolved dependencies or programme history.
"""
          new = """The finite response calculus and category-reconstruction theorem were extracted from EIG material developed on 2026-08-30/31. The current canonical EIG Core formulation was reconstructed and audited separately on 2026-09-03. Public files:

- [`../EIG_CORE.md`](../EIG_CORE.md)
- [`../theory/01-finite-exact-interactions.md`](../theory/01-finite-exact-interactions.md)
- [`../theory/02-category-reconstruction.md`](../theory/02-category-reconstruction.md)

Earlier programme-level foundation, boundary-atlas, WEIR, roadmap, and status documents are preserved in Git history rather than kept as competing current formulations. The larger research ledger is intentionally not mirrored here.
"""
          if old not in s:
              raise SystemExit('SOURCE_MAP foundational block not found')
          s = s.replace(old, new)
          p.write_text(s)
          PY

          git rm EIG_IDENTIFIABILITY_BOUNDARIES_20260902.md FOUNDATIONS.md ROADMAP.md STATUS.md theory/03-weir.md
          rm -f .eig-prune-trigger .github/workflows/eig-prune-superseded.yml

          if git grep -n -E 'EIG_IDENTIFIABILITY_BOUNDARIES_20260902\.md|FOUNDATIONS\.md|ROADMAP\.md|STATUS\.md|theory/03-weir\.md' -- . ':!.git' ; then
            echo 'stale references remain'
            exit 1
          fi

          git config user.name 'Keigo Oka'
          git config user.email 'ogiekako@users.noreply.github.com'
          git add README.md provenance/SOURCE_MAP.md .github/workflows/eig-prune-superseded.yml .eig-prune-trigger || true
          git status --short
          git commit -am 'Prune superseded EIG foundation documents'
          git push origin HEAD:staging/eig-core-canonical
