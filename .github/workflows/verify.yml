name: verify

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  exact-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging/eig-core-canonical
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Polish EIG Core theorem spine
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          python .github/polish_eig_core_spine.py
          sed -i 's/[[:space:]]\+$//' EIG_CORE.md
          git diff --check
          if ! git diff --quiet -- EIG_CORE.md; then
            git config user.name 'Keigo Oka'
            git config user.email 'ogiekako@users.noreply.github.com'
            git add EIG_CORE.md
            git commit -m 'Polish EIG Core theorem spine'
            git push origin HEAD:staging/eig-core-canonical
          fi
      - run: make verify-all
