name: verify

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  exact-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Remove residual presentation marker
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('EIG_CORE.md')
          s = p.read_text()
          old = '## 6.4 Equivalence invariance **[COROLLARY]**'
          new = '## 6.4 Equivalence invariance'
          if s.count(old) != 1:
              raise SystemExit(f'expected one residual marker, found {s.count(old)}')
          s = s.replace(old, new)
          for forbidden in ('Level-2', 'D_2', 'S_1', '[COROLLARY]'):
              if forbidden in s:
                  raise SystemExit(f'stale presentation notation remains: {forbidden}')
          p.write_text(s)
          PY
      - name: Restore normal workflow in working tree
        run: |
          cat > .github/workflows/verify.yml <<'EOF'
          name: verify

          on:
            push:
            pull_request:

          jobs:
            exact-regression:
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@v4
                - uses: actions/setup-python@v5
                  with:
                    python-version: '3.12'
                - run: make verify-all
          EOF
      - run: make verify-all
      - name: Commit presentation cleanup
        run: |
          git diff --check
          git config user.name "Keigo Oka"
          git config user.email "ogiekako@users.noreply.github.com"
          git add EIG_CORE.md .github/workflows/verify.yml
          git commit -m "Remove residual presentation marker from EIG Core"
          git push origin HEAD:main
