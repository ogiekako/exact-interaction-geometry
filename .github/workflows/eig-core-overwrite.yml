name: EIG Core overwrite

on:
  push:
    branches:
      - staging/eig-core-canonical
    paths:
      - '.eig-upload/**'
      - '.github/workflows/eig-core-overwrite.yml'

permissions:
  contents: write

jobs:
  overwrite:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble canonical EIG core when all chunks are present
        shell: bash
        run: |
          set -euo pipefail
          count=$(find .eig-upload -maxdepth 1 -type f -name 'part-*' 2>/dev/null | wc -l || true)
          if [ "$count" -ne 7 ]; then
            echo "Waiting for all chunks: $count/7"
            exit 0
          fi
          cat .eig-upload/part-* | base64 -d > EIG_CORE.md
          echo '30f50e12dfc24171a688d29c585d6cee687b81deb491506fd62f647d35efa2c6  EIG_CORE.md' | sha256sum -c -
          rm -rf .eig-upload
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add EIG_CORE.md .eig-upload
          git commit -m 'Replace EIG core with maximal canonical proof stack'
          git push origin HEAD:staging/eig-core-canonical
