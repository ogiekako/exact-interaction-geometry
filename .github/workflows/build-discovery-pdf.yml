name: Build discovery PDF

# The checked-in PDF is rebuilt from the TeX source on main.
on:
  push:
    branches: [main]
    paths:
      - 'discoveries/binary-kronecker-counterexample.tex'
      - '.github/workflows/build-discovery-pdf.yml'
  pull_request:
    paths:
      - 'discoveries/binary-kronecker-counterexample.tex'
      - '.github/workflows/build-discovery-pdf.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-pdf:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install TeX
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            latexmk \
            lmodern \
            texlive-latex-base \
            texlive-latex-recommended \
            texlive-latex-extra \
            texlive-fonts-recommended

      - name: Compile typeset note
        run: |
          mkdir -p build
          latexmk \
            -pdf \
            -interaction=nonstopmode \
            -halt-on-error \
            -file-line-error \
            -outdir="$GITHUB_WORKSPACE/build" \
            discoveries/binary-kronecker-counterexample.tex
          test -s build/binary-kronecker-counterexample.pdf

      - name: Upload compiled PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: binary-kronecker-counterexample-pdf
          path: build/binary-kronecker-counterexample.pdf
          if-no-files-found: error

      - name: Publish PDF on main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          cp build/binary-kronecker-counterexample.pdf discoveries/binary-kronecker-counterexample.pdf
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add discoveries/binary-kronecker-counterexample.pdf
          if git diff --cached --quiet; then
            echo 'Tracked PDF is already current.'
            exit 0
          fi
          git commit -m 'Build binary-Kronecker PDF'
          git push
