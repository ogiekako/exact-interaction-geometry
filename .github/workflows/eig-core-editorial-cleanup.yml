name: EIG Core editorial cleanup

on:
  push:
    branches:
      - staging/eig-core-canonical

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging/eig-core-canonical
          fetch-depth: 0

      - name: Apply presentation-only edits and verify mathematical invariants
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('EIG_CORE.md')
          before = path.read_text()
          s = before

          replacements = [
              ('# Exact Interaction Geometry — Maximal Proof Stack', '# Exact Interaction Geometry — Core Canonicality and Reconstruction'),
              ('## Strongest currently defensible EIG Core / EIG canonicality architecture assembled from the three 2026-09-03 reconstructions', '## Canonical semantic closure, doctrine dependence, and exact reconstruction boundaries'),
              ('''**Date:** 2026-09-03 JST  \n**Status:** consolidated theorem stack / strongest defensible synthesis of the supplied reconstructions  \n**Source basis:**\n\n- `EIG_CORE_MAXIMAL_CANONICALITY_RECONSTRUCTION_20260903.md`\n- `EIG_CORE_MAXIMAL_CANONICALITY_RECONSTRUCTION_20260903(1).md`\n- `EIG_CORE_MAXIMAL_CANONICALITY_RECONSTRUCTION_20260903(4).md`\n\nThis document is not a fourth independent architecture. It is a **consolidation**: the maximal-canonicality spine is taken from the strongest corrected reconstruction, while strictly stronger compatible modules from the other reconstructions are retained only after repairing them so that they do not weaken, overstate, or conflict with that spine.\n''', '''**Date:** 2026-09-03 JST  \n**Status:** canonical research note  \n\nThis note states the generic EIG Core / EIG canonicality architecture, its exact hypotheses, reconstruction gates, and no-go boundaries.\n'''),
              ('# 0. Executive adjudication of the three source documents', '# 0. Scope and structural synthesis'),
              ('## 0.1 They are not literally or theorem-theoretically identical', '## 0.1 Structural conclusions'),
              ('The three reconstructions converge on the same central discovery:', 'The framework rests on three structural conclusions:'),
              ('But they do **not** reach exactly the same strongest theorem package.', 'These conclusions are kept logically distinct and combined only where their hypotheses are compatible.'),
              ('### The unnumbered reconstruction', '### Simultaneous closure and descent'),
              ('It establishes the crucial replacement of modality-stratified maximality by an order-independent simultaneous closure, and it identifies descent of the doctrine-relative core along the doctrine-forgetful map as the correct doctrine-free question. It is therefore a decisive architectural predecessor.', 'The architecture replaces modality-stratified maximality by an order-independent simultaneous closure, and identifies descent of the doctrine-relative core along the doctrine-forgetful map as the correct doctrine-free question.'),
              ('However, several of its no-go statements are stated in a form that is later sharpened: in particular, noncontractibility of an undifferentiated solution/moduli space is not by itself an absolute obstruction to a canonical point.', 'The corresponding no-go language is sharpened accordingly: noncontractibility of an undifferentiated solution/moduli space is not by itself an absolute obstruction to a canonical point.'),
              ('### Reconstruction `(1)`', '### Closure modality, entailment, functoriality, and operation fibres'),
              ('This version contains several genuine strengthenings that should survive:', 'The following compatible results are included:'),
              ('But it also contains statements that cannot be retained verbatim:', 'The following formulations are excluded:'),
              ('- its default semantic root is obtained by transporting a raw Tiny root through reduction, whereas contextual reduction need not preserve Tiny/Cauchy roots;', '- obtaining the default semantic root by transporting a raw Tiny root through reduction, since contextual reduction need not preserve Tiny/Cauchy roots;'),
              ('- its broad slogan that raw nonempty noncontractible reconstruction fibres are already the exact final no-go is too strong;', '- treating raw nonempty noncontractible reconstruction fibres as already giving the exact final no-go;'),
              ('- its partial-context theorem makes internal definedness observable unless explicitly repaired.', '- making internal definedness observable in a partial-context theorem unless it is explicitly admitted.'),
              ('### Reconstruction `(4)`', '### Canonicality/no-go spine'),
              ('This is the strongest **master canonicality/no-go spine** among the three. It corrects all of the above structural defects by:', 'The canonicality/no-go spine is characterized by:'),
              ('## 0.2 Consolidation rule', '## 0.2 Integration rule'),
              ('The strongest defensible combined document is therefore:', 'The integration rule is:'),
              ('> **Use `(4)` as the logical spine. Import from `(1)` every stronger orthogonal theorem that remains valid after replacing raw-root-first semantics, unqualified contractibility claims, and definedness assumptions by the corrected `(4)` architecture. Treat the unnumbered reconstruction as an architectural predecessor whose strongest content is subsumed by this combination.**', '> **Use reduced-world root extraction and simultaneous semantic closure as the logical spine. Retain every compatible orthogonal theorem only in a form that preserves that spine, the reduced-root ordering, and the specified-solution/invariant no-go boundary.**'),
              ('This document implements exactly that rule.', 'The remainder of the note implements that rule.'),
              ('# 1. Status notation and the meaning of “strongest”', '# 1. Status notation and scope'),
              ('- **[PROVED]** — proved in this stack from explicitly stated hypotheses.', '- **[PROVED]** — proved here from explicitly stated hypotheses.'),
              ('“Strongest” means the following.', 'When this note uses “strongest” or “maximal,” it means the following.'),
              ('# 3. Contextual reduction: strongest Set-like theorem and higher-level boundary', '# 3. Contextual reduction: Set-like theorem and higher-level boundary'),
              ('The strongest compatible result imported from reconstruction `(1)` is a **forward functoriality theorem** for the closure modality. It strengthens the equivalence-only transport theorem without altering the `(4)` maximality boundary.', 'A **forward functoriality theorem** for the closure modality strengthens equivalence-only transport without altering the fixed-doctrine maximality boundary.'),
              ('This repairs the overstrong claim in reconstruction `(1)` while preserving its useful restriction-fibre formalism.', 'This is the specified-solution form of the operation-restriction fibre statement.'),
              ('# 12. Universal canonicality principle — corrected strongest form', '# 12. Universal canonicality principle'),
              ('The slogan from reconstruction `(1)`, “canonicality is contractibility of the reconstruction fibre,” becomes exactly correct only after the **entire requested universal property has been built into the solution problem**.', 'The slogan “canonicality is contractibility of the reconstruction fibre” becomes exactly correct only after the **entire requested universal property has been built into the solution problem**.'),
              ('# 17. Protected recurrent EIG: strongest currently justified specialization', '# 17. Protected recurrent EIG: currently justified specialization'),
              ('No result in the three reconstructions upgrades this generically to literal equality or to a stronger equivalence level.', 'No result established here upgrades this generically to literal equality or to a stronger equivalence level.'),
              ('This proof stack intentionally separates standard machinery from the project-specific synthesis.', 'This note intentionally separates standard machinery from the project-specific synthesis.'),
              ('The source documents correctly refrain from claiming that this whole synthesis already has an established literature-priority status. A dedicated exact-isomorphism/prior-art search is a separate task from proving the internal theorem stack.', 'This note does not claim that this whole synthesis already has an established literature-priority status. A dedicated exact-isomorphism/prior-art search is separate from proving the internal theorem stack.'),
              ('# 22. Strongest boxed theorem for EIG Core', '# 22. Main theorem for EIG Core'),
              ('### Strength statement', '### Scope'),
              ("This is stronger than the boxed positive theorem of `(4)` in one compatible direction: it promotes the root-specific least closure to the **entire seed-wise closure modality**, adds exact generation entailment, and adds forward lax functoriality. It does **not** weaken `(4)`'s reduced-root ordering, Moore-family existence boundary, internal-vs-external free distinction, or exact doctrine-free no-go architecture.", 'The statement is made for the **entire seed-wise closure modality**, not only the root-specific least closure, and includes exact generation entailment and forward lax functoriality. It preserves the reduced-root ordering, Moore-family existence boundary, internal-vs-external free distinction, and exact doctrine-free no-go architecture.'),
              ('# 23. Strongest boxed theorem for EIG as a whole', '# 23. Main theorem for EIG as a whole'),
              ('# 24. Strongest boxed impossibility theorem', '# 24. Canonicality/no-go theorem'),
              ('The following stronger claims are **not** supported by the three reconstructions and should not appear in EIG Core as established results.', 'The following stronger claims are **not established here** and should not appear in EIG Core as established results.'),
              ('# 27. Recommended canonical repository formulation', '# 27. Canonical repository formulation'),
              ('# 28. Final consolidated statement', '# 28. Summary statement'),
              ('This is the strongest combined form presently supported by the three supplied reconstruction documents without adding unproved hypotheses or weakening the maximality boundary.', 'This is the form established here under the stated hypotheses, without adding unproved assumptions or weakening the maximality boundary.'),
              ('# Appendix A. EIG-exactness labels: strongest nonconflating form', '# Appendix A. EIG-exactness labels: nonconflating form'),
              ('# Appendix C. Meta-EIG after maximal-canonicality repair', '# Appendix C. Meta-EIG under the same canonicality discipline'),
          ]

          for old, new in replacements:
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one occurrence, found {count}: {old[:120]!r}')
              s = s.replace(old, new)

          def display_math(text):
              lines = text.splitlines()
              out, cur = [], None
              for line in lines:
                  if cur is None and line.strip() == r'\[':
                      cur = [line]
                  elif cur is not None:
                      cur.append(line)
                      if line.strip() == r'\]':
                          out.append('\n'.join(cur))
                          cur = None
              return out

          def code_blocks(text):
              lines = text.splitlines()
              out, cur = [], None
              for line in lines:
                  if cur is None and line.startswith('```'):
                      cur = [line]
                  elif cur is not None:
                      cur.append(line)
                      if line.startswith('```'):
                          out.append('\n'.join(cur))
                          cur = None
              return out

          def proof_blocks(text):
              lines = text.splitlines()
              out = []
              i = 0
              while i < len(lines):
                  if lines[i].strip() == '### Proof':
                      j = i + 1
                      while j < len(lines) and not lines[j].startswith('#'):
                          j += 1
                      out.append('\n'.join(lines[i:j]))
                      i = j
                  else:
                      i += 1
              return out

          def boxed_theorems(text):
              lines = text.splitlines()
              out = []
              i = 0
              while i < len(lines):
                  if lines[i].startswith('> ## THEOREM'):
                      j = i + 1
                      while j < len(lines) and (lines[j].startswith('>') or lines[j].strip() == ''):
                          j += 1
                      out.append('\n'.join(lines[i:j]))
                      i = j
                  else:
                      i += 1
              return out

          assert display_math(before) == display_math(s), 'display mathematics changed'
          assert code_blocks(before) == code_blocks(s), 'code blocks changed'
          assert proof_blocks(before) == proof_blocks(s), 'proof blocks changed'
          assert boxed_theorems(before) == boxed_theorems(s), 'boxed theorem statements changed'

          path.write_text(s)
          PY

          printf '%s  %s\n' 'aee5cc96ef6eb6c305aec2df9f48fc85f40b5c871569c361953b8d539a3f8a70' 'EIG_CORE.md' | sha256sum -c -
          test "$(git hash-object EIG_CORE.md)" = '46e988dae1cb4439633fb443611e26b46198d7d2'

      - name: Commit editorial cleanup
        shell: bash
        run: |
          if git diff --quiet -- EIG_CORE.md; then
            echo 'No changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add EIG_CORE.md
          git commit -m 'Polish EIG Core public presentation'
          git push origin HEAD:staging/eig-core-canonical
